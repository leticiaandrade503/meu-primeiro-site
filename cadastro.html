<!DOCTYPE html>
<html lang="pt-BR">


<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro Completo</title>
    <link rel="stylesheet" href="style.css">
</head>


<body>


    <header>
        <nav class="menu">
    <a href="index.html">Início</a>
    <a href="sobre.html">Sobre Mim</a>
    <a href="receitas.html">Receitas</a>
    <a href="hobbies.html">Hobbies</a>
    <a href="contato.html">Contato</a>

</nav>


        <h1>Formulário de Cadastro</h1>
        <p>Preencha os dados abaixo para realizar seu cadastro.</p>
    </header>


    <main>
        <form action="#" method="post">


            <!-- Dados Pessoais -->
            <section>
                <fieldset>
                    <legend>Dados Pessoais</legend>


                    <p>
                        <label for="nome">Nome Completo:</label>
                        <input type="text" id="nome" name="nome" required minlength="3" maxlength="100"
                            placeholder="Digite seu nome completo">
                    </p>


                    <p>
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required maxlength="100"
                            placeholder="exemplo@email.com">
                    </p>


                    <p>
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" required minlength="8" maxlength="20"
                            placeholder="Mínimo 8 caracteres">
                    </p>


                    <p>
                        <label for="dataNascimento">Data de Nascimento:</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" required>
                    </p>


                    <p>
                        <label for="idade">Idade:</label>
                        <input type="number" id="idade" name="idade" required min="0" max="120">
                    </p>


                    <p>
                        <label for="telefone">Telefone:</label>
                        <input type="tel" id="telefone" name="telefone" required pattern="[0-9]{10,11}"
                            placeholder="Somente números">
                    </p>
                </fieldset>
            </section>


            <!-- Gênero -->
            <section>
                <fieldset>
                    <legend>Gênero</legend>


                    <input type="radio" id="masculino" name="genero" value="Masculino" required>
                    <label for="masculino">Masculino</label>


                    <input type="radio" id="feminino" name="genero" value="Feminino">
                    <label for="feminino">Feminino</label>


                    <input type="radio" id="outro" name="genero" value="Outro">
                    <label for="outro">Outro</label>
                </fieldset>
            </section>


            <!-- Interesses -->
            <section>
                <fieldset>
                    <legend>Interesses</legend>


                    <input type="checkbox" id="tecnologia" name="interesses" value="Tecnologia">
                    <label for="tecnologia">Tecnologia</label><br>


                    <input type="checkbox" id="esportes" name="interesses" value="Esportes">
                    <label for="esportes">Esportes</label><br>


                    <input type="checkbox" id="musica" name="interesses" value="Música">
                    <label for="musica">Música</label><br>


                    <input type="checkbox" id="viagens" name="interesses" value="Viagens">
                    <label for="viagens">Viagens</label>
                </fieldset>
            </section>


            <!-- Localização -->
            <section>
                <fieldset>
                    <legend>Localização</legend>


                    <p>
                        <label for="cidade">Cidade:</label>
                        <select id="cidade" name="cidade" required>
                            <option value="">Selecione uma cidade</option>
                            <option value="Minas Gerais">Minas Gerais</option>
                            <option value="São Paulo">São Paulo</option>
                            <option value="Rio de Janeiro">Rio de Janeiro</option>
                            <option value="Curitiba">Curitiba</option>
                            <option value="Salvador">Salvador</option>
                        </select>
                    </p>
                </fieldset>
            </section>


            <!-- Comentários -->
            <section>
                <fieldset>
                    <legend>Comentários Adicionais</legend>


                    <p>
                        <label for="comentarios">Comentários:</label><br>
                        <textarea id="comentarios" name="comentarios" rows="5" cols="40" maxlength="500"
                            placeholder="Digite observações adicionais..."></textarea>
                    </p>
                </fieldset>
            </section>


            <!-- Botões -->
            <section>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar Formulário</button>
            </section>


        </form>
    </main>


    <footer>
        <p>&copy; Leticia 2026 - Sistema de Cadastro</p>
    </footer>


</body>


</html>
